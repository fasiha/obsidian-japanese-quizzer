<style>
:root {
  color-scheme: light dark;
  background-color: light-dark(white, #0d1117); 
  color: light-dark(#444, #c9d1d9);
}

ruby rt { color: light-dark(#888, #aaa); }

li.kanji-hover-highlight {
  background-color: light-dark(hsla(45deg, 80%, 80%, 80%), hsla(45deg, 80%, 20%, 40%));
}

.furigana-toggle {
  margin-left: 0.5em;
  font-size: 0.8em;
  cursor: pointer;
}

.buttonBox {
  position: fixed;
  top: 0;
  right: 0;
  margin: 1rem;

  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  align-items: center;
}
.buttonBox button { cursor: pointer; }

.sentence-block {
  /* No overflow set — required for sticky to work */
  border-bottom: 1px solid light-dark(#ddd, #222);
}

p { margin-bottom: 0; }
.sentence-block > p:first-child {
  position: sticky;
  top: 0;
  padding: 0.25em 0;
  background-color: light-dark(white, #0d1117); 
}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const buttonBox = document.createElement('div');
  buttonBox.className = 'buttonBox';

  {
    /** Toggle all furigana on/off button */
    const button = document.createElement('button');
    button.textContent = 'ふりがな';
    button.addEventListener('click', () => {
      document.querySelectorAll('button.furigana-toggle').forEach(o => o.click());
    })
    buttonBox.appendChild(button);
  }
  {
    /** Scroll to the last translation */
    const button = document.createElement('button');
    button.textContent = 'Last tl';
    button.addEventListener('click', () => {
      const arr = Array.from(document.querySelectorAll('details summary')).filter(o => o.textContent?.includes?.('Translation'));
      const last = arr.at(-1);
      last?.parentElement?.parentElement?.scrollIntoView()
      
    })
    buttonBox.appendChild(button);
  }
  document.querySelector('body')?.appendChild(buttonBox);

  // Highlight vocab list items in the same sentence-block when clicking a <ruby>.
  document.body.addEventListener('click', e => {
    const ruby = e.target.closest('ruby');
    const block = ruby?.closest('.sentence-block');
    block?.querySelectorAll('li.kanji-hover-highlight').forEach(li => li.classList.remove('kanji-hover-highlight'));
    if (!ruby || !block) return;
    const rt = ruby.querySelector('rt');
    const kanji = rt ? ruby.textContent.replace(rt.textContent, '') : ruby.textContent;
    if (!kanji.trim()) return;
    let scrolled = false;
    block.querySelectorAll('li').forEach(li => {
      if (li.textContent.includes(kanji)) {
        li.classList.add('kanji-hover-highlight');
        if (!scrolled) {
          li.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
          scrolled = true;
        }
      }
    });
  });

  // Adds a "ふりがな" toggle button to every Vocab <details> block that contains
  // a hidden .furigana-sentence span (emitted by annotate-vocab-inline.mjs).
  // Clicking it swaps the plain sentence paragraph above the block for the
  // pre-rendered <ruby>-annotated version, and clicking again swaps it back.
  document.querySelectorAll(".furigana-sentence").forEach((span) => {
    const details = span.closest("details");
    if (!details) return;
    const summary = details.querySelector("summary");
    if (!summary) return;

    // The sentence <p> is the nearest preceding sibling that is not itself a
    // <details> block — Grammar and/or Translation blocks may sit in between.
    let sentence = details.previousElementSibling;
    while (sentence && sentence.tagName === "DETAILS") {
      sentence = sentence.previousElementSibling;
    }
    if (!sentence) return;

    // Swap the sentence paragraph's content directly rather than toggling
    // `hidden` on two elements — pandoc places the (always-hidden) span
    // wherever it landed in the Vocab block's bullet list, not next to the
    // sentence, so toggling visibility in place wouldn't show anything useful.
    const plainHTML = sentence.innerHTML;
    const furiganaHTML = span.innerHTML;
    let showingFurigana = false;

    // Placed in its own <div> right after <summary> — NOT inside <summary> —
    // because a click anywhere inside <summary> toggles the <details> open
    // state natively, and that activation behaviour isn't reliably cancelable
    // by calling preventDefault() on the bubbled click from a child button.
    const row = document.createElement("div");
    row.className = "furigana-toggle-row";
    const button = document.createElement("button");
    button.textContent = "ふりがな";
    button.className = "furigana-toggle";
    button.addEventListener("click", () => {
      showingFurigana = !showingFurigana;
      sentence.innerHTML = showingFurigana ? furiganaHTML : plainHTML;
    });
    row.appendChild(button);
    summary.insertAdjacentElement("afterend", row);
  });
});
</script>
