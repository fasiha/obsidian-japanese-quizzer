<style>
:root {
  color-scheme: light dark;
  background-color: light-dark(white, #0d1117); 
  color: light-dark(#444, #c9d1d9);
  font-size: min(max(1rem, 4vw), 32px);
}

ruby rt, details summary { color: light-dark(#888, #888); }

li.kanji-hover-highlight {
  background-color: light-dark(hsla(45deg, 80%, 80%, 80%), hsla(45deg, 80%, 20%, 40%));
}

/* Furigana for a sentence shows while its Vocab <details> is open, no JS. The
   ruby copy (.sentence-furigana) is emitted by annotate-vocab-inline.mjs. */
.sentence-furigana { display: none; }
.sentence-block:has(details.vocab-details[open]) > p:first-child { display: none; }
.sentence-block:has(details.vocab-details[open]) > .sentence-furigana { display: block; }

.buttonBox {
  position: fixed;
  top: 0;
  right: 0;
  margin: 1rem;

  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  align-items: center;
}
.buttonBox button { cursor: pointer; }

.sentence-block {
  /* No overflow set — required for sticky to work */
  border-bottom: 1px solid light-dark(#ddd, #222);
}

p { margin-bottom: 0; }
.sentence-block > p:first-child,
.sentence-block > .sentence-furigana {
  position: sticky;
  top: 0;
  padding: 0.25em 0;
  background-color: light-dark(white, #0d1117); 
}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const buttonBox = document.createElement('div');
  buttonBox.className = 'buttonBox';

  {
    /** Open or close every Vocab block (which also shows or hides its furigana) */
    const button = document.createElement('button');
    button.textContent = 'ふりがな';
    button.addEventListener('click', () => {
      document.querySelectorAll('details.vocab-details').forEach(o => o.open = !o.open);
    })
    buttonBox.appendChild(button);
  }
  {
    /** Scroll to the last translation */
    const button = document.createElement('button');
    button.textContent = 'Last tl';
    button.addEventListener('click', () => {
      const arr = Array.from(document.querySelectorAll('details summary')).filter(o => o.textContent?.includes?.('Translation'));
      const last = arr.at(-1);
      last?.parentElement?.parentElement?.scrollIntoView()
      
    })
    buttonBox.appendChild(button);
  }
  document.querySelector('body')?.appendChild(buttonBox);

  // Highlight vocab list items in the same sentence-block when clicking a <ruby>.
  document.body.addEventListener('click', e => {
    const ruby = e.target.closest('ruby');
    const block = ruby?.closest('.sentence-block');
    block?.querySelectorAll('li.kanji-hover-highlight').forEach(li => li.classList.remove('kanji-hover-highlight'));
    if (!ruby || !block) return;
    const rt = ruby.querySelector('rt');
    const kanji = rt ? ruby.textContent.replace(rt.textContent, '') : ruby.textContent;
    if (!kanji.trim()) return;
    let scrolled = false;
    block.querySelectorAll('li').forEach(li => {
      if (li.firstChild?.textContent.includes(kanji)) {
        li.classList.add('kanji-hover-highlight');
        if (!scrolled) {
          li.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
          scrolled = true;
        }
      }
    });
  });

});
</script>
